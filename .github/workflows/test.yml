name: B2B Incident Response Lab CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: incidentlab
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ci-only-password
      VALID_ACCESS_TOKEN: ci-valid-token
      TEST_VALID_TOKEN: ci-valid-token
      TEST_BASE_URL: http://localhost:8088

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create CI environment
        run: |
          printf '%s\n' \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "VALID_ACCESS_TOKEN=${VALID_ACCESS_TOKEN}" \
            > .env

      - name: Start lab
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8088/health > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Run automated tests
        run: python -m pytest -q tests

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop lab
        if: always()
        run: docker compose down -v
